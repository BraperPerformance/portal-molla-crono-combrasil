      }
    }
    return;
  }

  /* navegação do calendário */
  const calBtn = ev.target.closest('[data-cal]');
  if (calBtn){
    const dir = Number(calBtn.dataset.cal);
    if (dir === 0) calAnchor = HOJE.slice(0, 7);
    else {
      const [a, m] = calAnchor.split('-').map(Number);
      const nova = new Date(a, m - 1 + dir, 1);
      calAnchor = `${nova.getFullYear()}-${String(nova.getMonth() + 1).padStart(2, '0')}`;
    }
    render();
    return;
  }

  /* chip do calendário / card do kanban → editar (admin) */
  const calChip = ev.target.closest('[data-cal-act]');
  if (calChip){
    if (session && session.role === 'admin') openActivityModal(calChip.dataset.calEixo, calChip.dataset.calAct);
    return;
  }
  const kbCard = ev.target.closest('[data-kb-act]');
  if (kbCard){
    if (session && session.role === 'admin') openActivityModal(kbCard.dataset.kbEixo, kbCard.dataset.kbAct);
    return;
  }

  /* botão adicionar atividade */
  const addBtn = ev.target.closest('[data-add-eixo]');
  if (addBtn){ openActivityModal(addBtn.dataset.addEixo, null); return; }

  /* importar em massa */
  const massaBtn = ev.target.closest('[data-massa-eixo]');
  if (massaBtn){ abrirImportacaoMassa(massaBtn.dataset.massaEixo); return; }

  /* botão editar eixo */
  const eixoBtn = ev.target.closest('[data-edit-eixo]');
  if (eixoBtn){ openEixoModal(eixoBtn.dataset.editEixo); return; }

  /* duplicar eixo (botão do cabeçalho) */
  const dupBtn = ev.target.closest('[data-dup-eixo]');
  if (dupBtn){
    const e = state.eixos.find(x => x.id === dupBtn.dataset.dupEixo);
    if (e) duplicarEixo(e);
    return;
  }

  /* ordenar por data e tipo */
  const sortBtn = ev.target.closest('[data-sort-eixo]');
  if (sortBtn){
    const e = state.eixos.find(x => x.id === sortBtn.dataset.sortEixo);
    if (!e) return;
    e.atividades.sort((x, y) => {
      if (x.inicio !== y.inicio) return x.inicio < y.inicio ? -1 : 1;
      const tx = TIPOS.indexOf(x.tipo), ty = TIPOS.indexOf(y.tipo);
      if (tx !== ty) return tx - ty;
      return x.fim < y.fim ? -1 : x.fim > y.fim ? 1 : 0;
    });
    persist(); render();
    toast('Atividades ordenadas por data de in\u00edcio e tipo');
    return;
  }

  if (!editMode) return;

  const tr = ev.target.closest('tr[data-eixo]');
  if (!tr) return;
  const eixo = state.eixos.find(x => x.id === tr.dataset.eixo);
  if (!eixo) return;

  /* mover linha */
  const mv = ev.target.closest('[data-move]');
  if (mv){
    const dir = Number(mv.dataset.move);
    const i = eixo.atividades.findIndex(a => a.id === tr.dataset.act);
    const j = i + dir;
    if (j < 0 || j >= eixo.atividades.length) return;
    [eixo.atividades[i], eixo.atividades[j]] = [eixo.atividades[j], eixo.atividades[i]];
    persist(); render();
    return;
  }

  /* clique nas colunas fixas (ou no ✎) abre o modal */
  if (ev.target.closest('[data-edit]') || ev.target.closest('td.sticky')){
    openActivityModal(tr.dataset.eixo, tr.dataset.act);
  }
});

/* ================================================================
   AUTENTICAÇÃO — hashes SHA-256 das senhas de grupo
   (as senhas não ficam em texto puro no código)
================================================================ */
const HASH_ADMIN   = 'f4024262919b1229e0f9714737c1534a48277f35cdf94852de294651fab6a419';
const HASH_CLIENTE = '2126d63cfcd68f11acbf47bfcb2b558987e89088591241a894c699334d62da0a';
const SESS_KEY = 'molla-crono-sessao';

/* SHA-256 compacto (funciona offline e em file://) */
function sha256(ascii){
  ascii = unescape(encodeURIComponent(ascii));
  function rr(v,a){ return (v>>>a)|(v<<(32-a)); }
  const maxWord = Math.pow(2,32);
  let result = '', words = [], asciiBitLength = ascii.length*8;
  let hash = sha256.h = sha256.h || [], k = sha256.k = sha256.k || [];
  let primeCounter = k.length, isComposite = {};
  for (let candidate = 2; primeCounter < 64; candidate++){
    if (!isComposite[candidate]){
      for (let i = 0; i < 313; i += candidate) isComposite[i] = candidate;
      hash[primeCounter] = (Math.pow(candidate,.5)*maxWord)|0;
      k[primeCounter++] = (Math.pow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii += '\x80';
  while (ascii.length%64 - 56) ascii += '\x00';
  for (let i = 0; i < ascii.length; i++){
    const j = ascii.charCodeAt(i);
    if (j>>8) return '';
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length] = (asciiBitLength/maxWord)|0;
  words[words.length] = asciiBitLength;
  for (let j = 0; j < words.length;){
    const w = words.slice(j, j += 16), oldHash = hash;
    hash = hash.slice(0,8);
    for (let i = 0; i < 64; i++){
      const w15 = w[i-15], w2 = w[i-2];
      const a = hash[0], e = hash[4];
      const temp1 = hash[7]
        + (rr(e,6)^rr(e,11)^rr(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i] = (i<16) ? w[i] : (w[i-16] + (rr(w15,7)^rr(w15,18)^(w15>>>3)) + w[i-7] + (rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      const temp2 = (rr(a,2)^rr(a,13)^rr(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash = [(temp1+temp2)|0].concat(hash);
      hash[4] = (hash[4]+temp1)|0;
    }
    for (let i = 0; i < 8; i++) hash[i] = (hash[i]+oldHash[i])|0;
  }
  for (let i = 0; i < 8; i++){
    for (let j = 3; j+1; j--){
      const b = (hash[i]>>(j*8))&255;
      result += ((b<16)?0:'') + b.toString(16);
    }
  }
  return result;
}

let session = null;
try { session = JSON.parse(sessionStorage.getItem(SESS_KEY) || 'null'); } catch(e){}

/* ============ sincronização com a nuvem (Vercel + Supabase) ============ */
const API_URL = 'api/cronograma';
let API_OK = false;
let syncTimer = null;
let pollTimer = null;
let ultimaAtualizacao = null;

function setSync(estado){
  const b = document.getElementById('syncBadge');
  const mapa = {
    ok:       ['ok', 'Nuvem: sincronizado'],
    salvando: ['salvando', 'Nuvem: salvando…'],
    rascunho: ['rascunho', 'Altera\u00e7\u00f5es n\u00e3o salvas'],
    local:    ['', 'Modo local'],
    erro:     ['erro', 'Nuvem: falha ao salvar'],
  };
  const [cls, txt] = mapa[estado] || mapa.local;
  b.className = 'sync-badge' + (cls ? ' ' + cls : '');
  b.textContent = txt;
}

async function carregarDoServidor(){
  if (!session) return 'sem-sessao';
  try {
    const r = await fetch(API_URL, { headers: { 'x-chave': session.chave } });
    if (r.status === 404){ API_OK = true; return 'vazio'; }
    if (!r.ok) throw 0;
    const j = await r.json();
    API_OK = true;
    ultimaAtualizacao = j.atualizado_em || null;
    if (j.dados && j.dados.cliente && Array.isArray(j.dados.eixos)){
      state = j.dados;
      persistLocal();
    }
    return 'ok';
  } catch(e){
    API_OK = false;
    return 'offline';
  }
}

async function salvarNoServidor(){
  if (!API_OK || !session || session.role !== 'admin') return false;
  try {
    const r = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-chave': session.chave },
      body: JSON.stringify(state),
    });
    if (!r.ok) throw 0;
    setSync('ok');
    return true;
  } catch(e){
    setSync('erro');
    toast('Não foi possível salvar na nuvem — suas alterações estão guardadas neste navegador');
    return false;
  }
}

async function salvarAlteracoes(){
  if (!session || session.role !== 'admin') return;
  registrarLog('Salvou as altera\u00e7\u00f5es');
  persistLocal();
  if (API_OK){
    setSync('salvando');
    const ok = await salvarNoServidor();
    if (ok){ dirty = false; snapshotSalvo(); toast('Altera\u00e7\u00f5es salvas na nuvem \u2014 todos ver\u00e3o esta vers\u00e3o'); }
  } else {
    snapshotSalvo();
    dirty = false;
    setSync('local');
    toast('Altera\u00e7\u00f5es salvas neste navegador (modo local, sem nuvem)');
  }
}

async function restaurarUltimaSalva(){
  if (!session || session.role !== 'admin') return;
  if (!confirm('Restaurar a \u00faltima vers\u00e3o salva? As altera\u00e7\u00f5es n\u00e3o salvas ser\u00e3o descartadas.')) return;
  if (API_OK){
    const st = await carregarDoServidor();
    if (st === 'ok'){
      dirty = false; snapshotSalvo(); setSync('ok');
      aplicarBranding(); render();
      toast('\u00daltima vers\u00e3o salva restaurada (da nuvem)');
      return;
    }
  }
  let snap = null;
  try { snap = JSON.parse(localStorage.getItem(LS_KEY + '-salvo') || 'null'); } catch(e){}
  if (snap && snap.eixos){
    state = snap; migrar(state);
    persistLocal(); dirty = false; setSync(API_OK ? 'ok' : 'local');
    aplicarBranding(); render();
    toast('\u00daltima vers\u00e3o salva restaurada (deste navegador)');
  } else {
    toast('Nenhuma vers\u00e3o salva encontrada ainda');
  }
}

function iniciarPolling(){
  clearInterval(pollTimer);
  if (!API_OK || !session || session.role === 'admin') return;
  pollTimer = setInterval(async () => {
    try {
      const r = await fetch(API_URL, { headers: { 'x-chave': session.chave } });
      if (!r.ok) return;
      const j = await r.json();
      if (j.atualizado_em && j.atualizado_em !== ultimaAtualizacao){
        ultimaAtualizacao = j.atualizado_em;
        if (j.dados && j.dados.cliente && Array.isArray(j.dados.eixos)){
          state = j.dados;
          persistLocal();
          aplicarBranding();
          render();
          toast('Cronograma atualizado pela equipe Molla');
        }
      }
    } catch(e){}
  }, 60000);
}

async function conectarNuvem(){
  const st = await carregarDoServidor();
  if (st === 'ok'){
    dirty = false;
    snapshotSalvo();
    setSync('ok');
    aplicarBranding();
    render();
  } else if (st === 'vazio'){
    if (session.role === 'admin'){
      setSync('salvando');
      const ok = await salvarNoServidor();
      if (ok){ dirty = false; snapshotSalvo(); }
      toast('Cronograma publicado na nuvem pela primeira vez');
    } else {
      setSync('local');
    }
  } else {
    setSync('local');
  }
  iniciarPolling();
}

function aplicarSessao(){
  document.body.classList.remove('authed','role-admin','role-cliente');
  if (!session) return;
  document.body.classList.add('authed', session.role === 'admin' ? 'role-admin' : 'role-cliente');
  document.getElementById('userNome').textContent = session.nome;
  document.getElementById('userAvatar').textContent = (session.nome[0]||'?').toUpperCase();
  const rb = document.getElementById('roleBadge');
  rb.textContent = session.role === 'admin' ? 'ADMIN' : 'CLIENTE';
  rb.classList.toggle('cliente', session.role !== 'admin');
}

function entrar(){
  const nome = document.getElementById('loginNome').value.trim();
  const senha = document.getElementById('loginSenha').value;
  const erro = document.getElementById('loginErro');
  const card = document.getElementById('loginCard');
  const falha = msg => {
    erro.textContent = msg; erro.classList.add('show');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  };
  if (!nome){ falha('Digite seu nome para se identificar.'); return; }
  if (!senha){ falha('Digite a senha de acesso.'); return; }
  const h = sha256(senha);
  let role = null;
  if (h === HASH_ADMIN) role = 'admin';
  else if (h === HASH_CLIENTE) role = 'cliente';
  if (!role){ falha('Senha incorreta. Confira o acesso com a equipe Molla.'); return; }
  session = { nome, role, chave: h };
  try { sessionStorage.setItem(SESS_KEY, JSON.stringify(session)); } catch(e){}
  erro.classList.remove('show');
  document.getElementById('loginSenha').value = '';
  aplicarSessao();
  render();
  toast('Bem-vindo(a), ' + nome + '!');
  conectarNuvem();
}

document.getElementById('loginSenha').addEventListener('keydown', ev => { if (ev.key === 'Enter') entrar(); });
document.getElementById('loginNome').addEventListener('keydown', ev => { if (ev.key === 'Enter') entrar(); });

  API_OK = false;

});

/* ============ exportar / importar / cópia / configurações (admin) ============ */
const slug = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const hojeArquivo = () => HOJE.replace(/-/g,'');

function download(nomeArquivo, mime, conteudo){
  const a = document.createElement('a');
  a.href = 'data:' + mime + ';charset=utf-8,' + encodeURIComponent(conteudo);
  a.download = nomeArquivo;
  document.body.appendChild(a); a.click(); a.remove();
}

document.getElementById('expBtn').addEventListener('click', () => {
  if (session?.role !== 'admin') return;
  download(`cronograma-${slug(state.cliente.nome)}-${hojeArquivo()}.json`, 'application/json', JSON.stringify(state, null, 1));
  toast('JSON exportado — guarde ou compartilhe com o time');
});

document.getElementById('impBtn').addEventListener('click', () => {
  if (session?.role !== 'admin') return;
  document.getElementById('impFile').click();
});
document.getElementById('impFile').addEventListener('change', ev => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const dados = JSON.parse(reader.result);
      if (!dados || !dados.cliente || !Array.isArray(dados.eixos)) throw new Error('formato');
      if (!confirm(`Importar o cronograma de "${dados.cliente.nome}"? Os dados atuais deste navegador serão substituídos.`)) return;
      state = dados;
      persist(); aplicarBranding(); render();
      toast('Cronograma importado');
    } catch(e){
      toast('Arquivo inválido — selecione um JSON exportado por esta ferramenta');
    }
  };
  reader.readAsText(file);
});

document.getElementById('copiaBtn').addEventListener('click', () => {
  if (session?.role !== 'admin') return;
  const M1 = '/*__SE' + 'ED__*/', M2 = '/*__ENDSE' + 'ED__*/';
  const clone = document.documentElement.cloneNode(true);
  clone.querySelector('#views').innerHTML = '';
  clone.querySelector('#tabs').innerHTML = '';
  clone.querySelector('#modal').innerHTML = '';
  clone.querySelector('#overlay').classList.remove('open');
  clone.querySelector('#toast').className = 'toast';
  clone.querySelector('body').className = '';
  clone.querySelectorAll('input').forEach(i => { i.removeAttribute('value'); i.removeAttribute('checked'); });
  let html = '<!DOCTYPE html>\n' + clone.outerHTML;
  const i1 = html.indexOf(M1), i2 = html.indexOf(M2);
  if (i1 > -1 && i2 > i1){
    const json = JSON.stringify(state).replace(/<\//g, '<\\/');
    html = html.slice(0, i1 + M1.length) + json + html.slice(i2);
  }
  download(`cronograma-${slug(state.cliente.nome)}-${hojeArquivo()}.html`, 'text/html', html);
  toast('Cópia gerada com os dados atuais embutidos');
});

document.getElementById('cfgBtn').addEventListener('click', () => {
  if (session?.role !== 'admin') return;
  const c = state.cliente;
  modalEl.innerHTML = `
    <div class="eyebrow">Whitelabel</div>
    <h3>Configurações do cliente</h3>
    <div class="field"><label>Nome do cliente</label><input type="text" id="f-cli-nome" value="${esc(c.nome)}"></div>
    <div class="field"><label>Título do projeto</label><input type="text" id="f-cli-proj" value="${esc(c.projeto)}"></div>
    <div class="field">
      <label>Logo do cliente</label>
      <input type="file" id="f-cli-logo" accept="image/*">
      <img class="cfg-logo-preview" id="f-cli-preview" src="${esc(c.logo || LOGOS.combrasil)}" alt="Prévia da logo">
      <div class="help">PNG com fundo transparente ou branco funciona melhor. A logo aparece no cabeçalho e na tela de login.</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sec" id="f-cancel">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Salvar</button>
    </div>`;
  overlay.classList.add('open');
  let novaLogo = null;
  modalEl.querySelector('#f-cli-logo').addEventListener('change', ev => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      novaLogo = reader.result;
      modalEl.querySelector('#f-cli-preview').src = novaLogo;
    };
    reader.readAsDataURL(file);
  });
  modalEl.querySelector('#f-cancel').onclick = closeModal;
  modalEl.querySelector('#f-save').onclick = () => {
    const nome = modalEl.querySelector('#f-cli-nome').value.trim();
    if (!nome){ toast('O cliente precisa de um nome'); return; }
    state.cliente.nome = nome;
    state.cliente.projeto = modalEl.querySelector('#f-cli-proj').value.trim() || 'Cronograma do Projeto';
    if (novaLogo) state.cliente.logo = novaLogo;
    registrarLog('Atualizou configura\u00e7\u00f5es do cliente (' + nome + ')');
    persist(); closeModal(); aplicarBranding(); render();
    toast('Configurações salvas');
  };
});

document.getElementById('projBtn').addEventListener('click', () => {
  if (session?.role !== 'admin') return;
  migrar(state);
  const p = state.projeto;
  modalEl.innerHTML = `
    <div class="eyebrow">Configura\u00e7\u00f5es</div>
    <h3>Configura\u00e7\u00f5es do projeto</h3>
    <div class="field"><label>Data limite de entrega do projeto</label>
      <input type="date" id="f-limite" value="${p.dataLimite || ''}">
      ${(() => {
        const fimReal = fimProjetoAtual();
        return fimReal ? `<div class="help" style="font-weight:800;color:var(--mo-graphite)">Sugest\u00e3o: hoje, a \u00faltima atividade termina em ${brFull(fimReal)} \u2014 essa \u00e9 a data mais pr\u00f3xima em que o projeto consegue ser entregue. Limites anteriores a ela gerar\u00e3o estouros.</div>` : '';
      })()}
      <div class="help">Ao definir, nenhuma atividade poder\u00e1 ser salva com data al\u00e9m deste limite, e uma linha vermelha marca o dia em todos os cronogramas. Se um reagendamento em cascata ultrapassar o limite, o sistema avisa e destaca as atividades em vermelho. Deixe vazio para remover o limite.</div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-sec" id="f-cancel">Cancelar</button>
      <button class="btn btn-primary" id="f-save">Salvar</button>
    </div>`;
  overlay.classList.add('open');
  modalEl.querySelector('#f-cancel').onclick = closeModal;
  modalEl.querySelector('#f-save').onclick = () => {
    const v = modalEl.querySelector('#f-limite').value || null;
    if (v){
      const todas = state.eixos.flatMap(x => x.atividades);
      const nAlem = todas.filter(a => a.fim > v).length;
      state.projeto.dataLimite = v;
      registrarLog('Definiu limite do projeto: ' + brFull(v));
      persist(); closeModal(); render();
      const fimReal = fimProjetoAtual();
      toast(nAlem
        ? 'Limite definido para ' + brFull(v) + ' \u2014 ' + nAlem + ' atividade(s) ultrapassam \u00b7 ' + diffDays(D(v), D(fimReal)) + ' dia(s) acima \u00b7 sugest\u00e3o de limite: ' + brFull(fimReal)
        : 'Limite do projeto definido para ' + brFull(v));
    } else {
      state.projeto.dataLimite = null;
      registrarLog('Removeu o limite do projeto');
      persist(); closeModal(); render();
      toast('Limite do projeto removido');
    }
  };
});

document.getElementById('saveBtn').addEventListener('click', salvarAlteracoes);
document.getElementById('restoreBtn').addEventListener('click', restaurarUltimaSalva);
document.getElementById('gabBtn').addEventListener('click', abrirGabaritos);
function abrirGabaritos(){
  if (session?.role !== 'admin') return;
  migrar(state);
  modalEl.innerHTML = `
    <div class="eyebrow">Biblioteca Molla</div>
    <h3>Gabaritos de cronograma</h3>
    <div class="help" style="margin-top:8px;font-size:.78rem;color:var(--mo-mist);font-weight:500">
      Gabaritos s\u00e3o estruturas-padr\u00e3o com SLAs em dias \u00fateis, usadas no retro-planejamento ao criar um novo eixo.
      Para criar ou atualizar um: monte (ou ajuste) um eixo e use \u201cSalvar como gabarito\u201d em \u201c\u270e Editar eixo\u201d.
    </div>
    <div style="margin-top:10px">
      ${state.gabaritos.map(g => {
        const sla = g.atividades.reduce((s, a) => s + (a.sla || 1), 0);
        const marcos = g.atividades.filter(a => a.marco).length;
        return `<div class="gab-linha">
          <div class="info"><b>${esc(g.nome)}</b>
            <span>${g.atividades.length} atividades \u00b7 soma dos SLAs: ${sla} dias \u00fateis \u00b7 ${marcos} marco(s) de aprova\u00e7\u00e3o</span>
          </div>
          <button class="btn btn-danger" data-del-gab="${g.id}" style="margin:0;padding:8px 14px;font-size:.74rem">Excluir</button>
        </div>`;
      }).join('') || '<div class="empty-state">Nenhum gabarito ainda.</div>'}
    </div>
    <div class="modal-actions"><button class="btn btn-sec" id="f-cancel">Fechar</button></div>`;
  overlay.classList.add('open');
  modalEl.querySelector('#f-cancel').onclick = closeModal;
  modalEl.querySelectorAll('[data-del-gab]').forEach(b => {
    b.onclick = () => {
      const g = state.gabaritos.find(x => x.id === b.dataset.delGab);
      if (!confirm('Excluir o gabarito "' + g.nome + '"? Eixos j\u00e1 criados a partir dele n\u00e3o s\u00e3o afetados.')) return;
      state.gabaritos = state.gabaritos.filter(x => x.id !== g.id);
      registrarLog('Excluiu gabarito "' + g.nome + '"');
      persist(); abrirGabaritos();
      toast('Gabarito exclu\u00eddo');
    };
  });
}

/* ============ branding + boot ============ */
function aplicarBranding(){
  const c = state.cliente;
  const logoCli = c.logo || LOGOS.combrasil;
  document.getElementById('logoMolla').src = LOGOS.molla_branca;
  document.getElementById('logoCliente').src = logoCli;
  document.getElementById('tituloProjeto').textContent = c.projeto;
  document.title = 'Cronograma Molla — ' + c.nome;
  document.getElementById('loginLogoCliente').src = logoCli;
  document.getElementById('loginLogoMolla').src = LOGOS.molla_laranja;
}

aplicarBranding();
aplicarSessao();
render();
if (session) conectarNuvem();
</script>
