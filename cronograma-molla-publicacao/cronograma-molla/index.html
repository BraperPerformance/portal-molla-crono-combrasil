<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cronograma Molla — Combrasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<style>
/* ============ MOLLA DESIGN TOKENS ============ */
:root{
  --mo-font:"Montserrat","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --mo-orange:#e85d04;
  --mo-orange-strong:#f56f0d;
  --mo-orange-soft:#fb8b24;
  --mo-orange-tint:#fff4ea;
  --mo-orange-tint2:#fde7cf;
  --mo-ink:#14161a;
  --mo-graphite:#3b424d;
  --mo-slate:#8a929e;
  --mo-mist:#6f7886;
  --mo-line:#e1e5ea;
  --mo-bg:#f7f8fa;
  --mo-panel:#f0f2f5;
  --mo-white:#fff;
  --mo-success:#1f8a4c;
  --mo-success-bg:#e7f4ec;
  --mo-warning:#b8860b;
  --mo-warning-bg:#fbf3e0;
  --mo-danger:#c0392b;
  --mo-danger-bg:#fbecea;
  --mo-radius:20px;
  --mo-shadow:0 18px 44px rgba(232,93,4,.14);
  --mo-shadow-sm:0 4px 14px rgba(20,22,26,.08);
  --cell-w:34px;
  --left-w:760px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:15px}
body{font-family:var(--mo-font);background:var(--mo-bg);color:var(--mo-ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}

/* ============ HEADER ============ */
.hero{
  background:linear-gradient(115deg,var(--mo-orange) 0%,var(--mo-orange-strong) 55%,var(--mo-orange-soft) 100%);
  color:var(--mo-white);
  padding:26px 32px 78px;
  position:relative;
  overflow:hidden;
}
.hero::after{
  content:"";position:absolute;right:-120px;top:-140px;width:420px;height:420px;border-radius:50%;
  background:rgba(255,255,255,.08);
}
.hero::before{
  content:"";position:absolute;right:60px;bottom:-180px;width:300px;height:300px;border-radius:50%;
  background:rgba(255,255,255,.06);
}
.hero-inner{max-width:1600px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:24px;position:relative;z-index:2}
.hero-brand{display:flex;align-items:center;gap:22px}
.hero-brand img.molla{height:44px;display:block}
.hero-divider{width:1px;height:44px;background:rgba(255,255,255,.35)}
.hero-title h1{font-size:1.32rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
.hero-title p{font-size:.8rem;font-weight:500;opacity:.85;margin-top:3px;text-transform:uppercase;letter-spacing:.14em}
.client-chip{
  background:var(--mo-white);border-radius:16px;padding:10px 18px;display:flex;align-items:center;gap:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.18);
}
.client-chip img{height:52px;display:block}
.client-chip .client-label{display:flex;flex-direction:column}
.client-chip .client-label span:first-child{font-size:.62rem;font-weight:700;color:var(--mo-slate);text-transform:uppercase;letter-spacing:.12em}
.client-chip .client-label span:last-child{font-size:.95rem;font-weight:800;color:var(--mo-ink)}

/* ============ NAV / TABS ============ */
.shell{max-width:1600px;margin:-46px auto 40px;padding:0 32px;position:relative;z-index:3}
.tabs{
  display:flex;gap:6px;background:var(--mo-white);border-radius:18px;padding:8px;
  box-shadow:var(--mo-shadow-sm);flex-wrap:wrap;align-items:center;
}
.tab{
  padding:10px 18px;border-radius:12px;font-size:.86rem;font-weight:600;color:var(--mo-mist);
  transition:all .18s ease;white-space:nowrap;
}
.tab:hover{background:var(--mo-orange-tint);color:var(--mo-orange)}
.tab.active{background:var(--mo-orange);color:var(--mo-white);box-shadow:0 6px 16px rgba(232,93,4,.35)}
.tab.tab-resumo{font-weight:700}
.tab-add{
  margin-left:auto;padding:10px 16px;border-radius:12px;font-size:.86rem;font-weight:600;
  color:var(--mo-slate);border:1.5px dashed var(--mo-line);
}
.tab-add span{opacity:.7;font-size:.72rem;font-weight:500}

/* ============ VIEW / CARDS ============ */
.view{margin-top:22px;display:none}
.view.active{display:block}
.card{
  background:var(--mo-white);border-radius:var(--mo-radius);box-shadow:var(--mo-shadow-sm);
  padding:26px 28px;margin-bottom:22px;
}

/* meta do eixo */
.eixo-meta{display:flex;justify-content:space-between;gap:28px;flex-wrap:wrap}
.eixo-meta .meta-main{flex:1;min-width:320px}
.eyebrow{font-size:.68rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--mo-orange);margin-bottom:8px}
.eixo-meta h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.eixo-meta .objetivo{margin-top:8px;color:var(--mo-mist);font-size:.94rem;font-weight:500;max-width:640px}
.eixo-meta .obs{margin-top:10px;font-size:.8rem;color:var(--mo-warning);background:var(--mo-warning-bg);border-radius:10px;padding:8px 12px;display:inline-block;font-weight:600}
.meta-side{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}
.meta-pill{
  background:var(--mo-panel);border-radius:14px;padding:12px 18px;min-width:110px;
}
.meta-pill .k{font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mo-slate);margin-bottom:4px}
.meta-pill .v{font-size:1.02rem;font-weight:800;color:var(--mo-ink)}
.especialistas{margin-top:16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.especialistas .k{font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.14em;color:var(--mo-slate)}
.esp-chip{
  display:inline-flex;align-items:center;gap:8px;background:var(--mo-orange-tint);color:#7a2e00;
  border-radius:999px;padding:6px 14px 6px 6px;font-size:.82rem;font-weight:700;
}
.esp-chip .avatar{
  width:26px;height:26px;border-radius:50%;background:var(--mo-orange);color:var(--mo-white);
  display:flex;align-items:center;justify-content:center;font-size:.68rem;font-weight:800;
}

/* legenda */
.legend{display:flex;gap:18px;flex-wrap:wrap;align-items:center;margin-top:18px;padding-top:16px;border-top:1px solid var(--mo-line)}
.legend .item{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:600;color:var(--mo-graphite)}
.dot{width:14px;height:14px;border-radius:5px}
.dot.concluido{background:var(--mo-success)}
.dot.andamento{background:linear-gradient(180deg,#fdd9ac,#fdc585)}
.dot.nao{background:#c4cad2}
.dot.risco{background:var(--mo-danger)}
.dot.hoje{width:3px;height:16px;border-radius:2px;background:var(--mo-ink)}
.dot.limite{width:3px;height:16px;border-radius:2px;background:var(--mo-danger)}
.cell-dt.estouro{color:var(--mo-danger);font-weight:800}
td.tcell.limite{box-shadow:inset -3px 0 0 var(--mo-danger)}
td.tcell.limite.hoje{box-shadow:inset 2px 0 0 var(--mo-ink), inset -3px 0 0 var(--mo-danger)}
th.tl-head.limite .tl-date{background:var(--mo-danger)!important;font-weight:800}
.dot.fds{background:repeating-linear-gradient(135deg,#eef0f3 0 4px,#e3e6ea 4px 8px);border:1px solid var(--mo-line)}
.legend .hint{margin-left:auto;font-size:.74rem;color:var(--mo-slate);font-weight:500}

/* ============ GANTT ============ */
.gantt-card{padding:0;overflow:hidden}
.gantt-scroll{overflow-x:auto;overscroll-behavior-x:contain}
.gantt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
.gantt th,.gantt td{font-size:.78rem;vertical-align:middle}

/* colunas fixas à esquerda */
.gantt .sticky{position:sticky;background:var(--mo-white);z-index:5}
.gantt thead .sticky{z-index:8}
.col-num{left:0;min-width:52px;max-width:52px;text-align:center}
.col-ativ{left:52px;min-width:172px;max-width:172px}
.col-desc{left:224px;min-width:300px;max-width:300px}
.col-resp{left:524px;min-width:92px;max-width:92px}
.col-ini{left:616px;min-width:56px;max-width:56px}
.col-fim{left:672px;min-width:56px;max-width:56px}
.col-dias{left:728px;min-width:44px;max-width:44px;border-right:2px solid var(--mo-line)!important}

.gantt thead th{
  background:var(--mo-ink);color:var(--mo-white);font-weight:700;text-align:left;
  padding:0 12px;height:44px;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;
  position:sticky;top:0;
}
.gantt thead .sticky{background:var(--mo-ink)}
/* header da régua de tempo: 3 linhas */
.tl-head{padding:0!important;text-align:center!important}
.tl-month{
  background:var(--mo-orange);color:var(--mo-white);font-size:.68rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.1em;height:24px;display:flex;align-items:center;justify-content:center;
  border-right:1px solid rgba(255,255,255,.25);
}
.tl-dow{
  height:20px;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;
  color:rgba(255,255,255,.75);text-transform:capitalize;background:var(--mo-ink);
  border-right:1px solid rgba(255,255,255,.08);
}
.tl-date{
  height:22px;display:flex;align-items:center;justify-content:center;font-size:.62rem;font-weight:700;
  color:var(--mo-white);background:var(--mo-ink);border-right:1px solid rgba(255,255,255,.08);
}
.tl-col{min-width:var(--cell-w);max-width:var(--cell-w);width:var(--cell-w)}
th.tl-head.fds .tl-dow, th.tl-head.fds .tl-date{color:rgba(255,255,255,.4)}
th.tl-head.hoje .tl-date{background:var(--mo-orange);font-weight:800}

/* corpo */
.gantt tbody td{border-bottom:1px solid var(--mo-line);padding:9px 12px;background:var(--mo-white)}
.gantt tbody tr:hover td{background:#fffaf5}
.gantt tbody tr:hover td.tcell.fds{background:repeating-linear-gradient(135deg,#f7ecdf 0 4px,#f2e3d2 4px 8px)}
.cell-num{font-weight:800;color:var(--mo-slate);font-size:.8rem}
.drag-handle{display:block;cursor:grab;color:#b7bec8;font-size:.85rem;line-height:1;margin:0 auto 3px;user-select:none;letter-spacing:-2px}
.drag-handle:active{cursor:grabbing}
tr.dragging td{opacity:.4}
tr.drop-alvo td{box-shadow:inset 0 3px 0 var(--mo-orange)}
.dep-badge{display:inline-block;margin-top:4px;margin-right:4px;font-size:.6rem;font-weight:800;letter-spacing:.04em;color:#9a3d00;background:var(--mo-orange-tint);border-radius:6px;padding:2px 8px}
.marco-badge{display:inline-block;margin-top:4px;font-size:.6rem;font-weight:800;letter-spacing:.04em;color:#3d5a8f;background:#e8ecf4;border-radius:6px;padding:2px 8px}
.check{display:flex;align-items:center;gap:9px;font-size:.82rem;font-weight:700;color:var(--mo-graphite);margin-top:16px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--mo-orange)}
.veredito{margin-top:12px;border-radius:12px;padding:13px 15px;font-size:.8rem;font-weight:600;line-height:1.55}
.veredito.ok{background:var(--mo-success-bg);color:var(--mo-success)}
.veredito.ruim{background:var(--mo-danger-bg);color:var(--mo-danger)}
.veredito .marcos{margin-top:6px;font-size:.74rem}
/* calendário */
.cal-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.cal-top h3{font-size:1.15rem;font-weight:800;text-transform:capitalize}
.cal-nav{display:flex;gap:8px}
.cal-nav button{padding:8px 14px;border-radius:10px;background:var(--mo-panel);font-weight:800;font-size:.78rem;color:var(--mo-graphite)}
.cal-nav button:hover{background:var(--mo-orange-tint);color:var(--mo-orange)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal-dow{font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mo-slate);text-align:center;padding:4px 0}
.cal-dia{min-height:116px;background:var(--mo-white);border:1px solid var(--mo-line);border-radius:10px;padding:6px;overflow:hidden}
.cal-dia.fora{opacity:.35}
.cal-dia.fds{background:repeating-linear-gradient(135deg,#f7f8fa 0 4px,#eef0f3 4px 8px)}
.cal-dia.hoje{border:2px solid var(--mo-ink)}
.cal-dia.limite{border:2px solid var(--mo-danger)}
.cal-dia .num{font-size:.72rem;font-weight:800;color:var(--mo-graphite);margin-bottom:4px}
.cal-chip{font-size:.6rem;font-weight:700;border-radius:6px;padding:3px 7px;margin-top:3px;cursor:default;line-height:1.25}
.cal-chip .c1{display:flex;align-items:baseline;gap:5px;min-width:0}
.cal-chip .c1 b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.6rem}
.cal-chip .ce{flex:none;font-size:.5rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;opacity:.65}
.cal-chip .c2{font-weight:500;font-size:.56rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
body.role-admin .cal-chip{cursor:pointer}
.cal-chip.c-nao_iniciado{background:#eef0f3;color:#6f7886}
.cal-chip.c-em_andamento{background:var(--mo-orange-tint2);color:#9a3d00}
.cal-chip.c-concluido{background:var(--mo-success-bg);color:var(--mo-success)}
.cal-chip.c-risco{background:var(--mo-danger-bg);color:var(--mo-danger)}
.cal-mais{font-size:.58rem;font-weight:800;color:var(--mo-slate);margin-top:3px}

/* kanban */
.kb-wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px;align-items:start}
.kb-col{background:var(--mo-panel);border-radius:16px;padding:12px;min-height:180px;transition:box-shadow .15s}
.kb-col.alvo{box-shadow:inset 0 0 0 2px var(--mo-orange)}
.kb-col h4{display:flex;align-items:center;gap:8px;font-size:.74rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mo-graphite)}
.kb-col h4 .qtd{margin-left:auto;background:var(--mo-white);border-radius:99px;padding:2px 9px;font-size:.68rem}
.kb-card{background:var(--mo-white);border-radius:11px;padding:10px 12px;margin-top:9px;box-shadow:var(--mo-shadow-sm);font-size:.76rem}
body.role-admin .kb-card{cursor:grab}
.kb-card.dragging{opacity:.4}
.kb-card b{display:block;font-size:.8rem;color:var(--mo-ink)}
.kb-card .meta{color:var(--mo-mist);font-weight:600;font-size:.66rem;margin-top:3px}
.kb-card .desc{color:var(--mo-mist);font-weight:500;font-size:.68rem;line-height:1.35;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.kb-card .eixo-tag{display:inline-block;margin-top:5px;font-size:.58rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;background:var(--mo-orange-tint);color:#9a3d00;border-radius:5px;padding:2px 7px}

/* log */
.log-linha{display:flex;gap:14px;padding:11px 0;border-bottom:1px solid var(--mo-line);font-size:.8rem;align-items:baseline}
.log-linha .quando{min-width:120px;font-weight:800;color:var(--mo-slate);font-size:.7rem;font-variant-numeric:tabular-nums}
.log-linha .quem{min-width:110px;font-weight:800;color:var(--mo-orange)}
.log-linha .acao{color:var(--mo-graphite);font-weight:600}
.tab-sep{width:1px;height:24px;background:var(--mo-line);margin:0 4px;align-self:center}

.prev-scroll{overflow-x:auto;margin-top:10px;border:1px solid var(--mo-line);border-radius:12px}
.prev-table{border-collapse:collapse;width:100%;font-size:.72rem}
.prev-table th{background:var(--mo-panel);font-weight:800;text-transform:uppercase;font-size:.6rem;letter-spacing:.08em;color:var(--mo-slate);padding:7px 10px;text-align:left;white-space:nowrap}
.prev-table td{padding:6px 10px;border-top:1px solid var(--mo-line);color:var(--mo-graphite);font-weight:600;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.map-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.gab-linha{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--mo-line)}
.gab-linha .info b{font-size:.9rem}
.gab-linha .info span{display:block;font-size:.72rem;color:var(--mo-mist);font-weight:600;margin-top:2px}
.cell-ativ{font-weight:700;color:var(--mo-ink)}
.cell-desc{color:var(--mo-mist);font-weight:500;line-height:1.35}
.cell-desc .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell-dt{font-weight:700;color:var(--mo-graphite);font-variant-numeric:tabular-nums;font-size:.72rem}
.cell-dias{text-align:center;font-weight:800;color:var(--mo-slate);font-size:.72rem}
.resp-tag{
  display:inline-block;padding:3px 9px;border-radius:999px;font-size:.66rem;font-weight:800;
  text-transform:uppercase;letter-spacing:.06em;
}
.resp-molla{background:var(--mo-orange-tint2);color:#9a3d00}
.resp-cliente{background:#e8ecf4;color:#3d5a8f}
.resp-misto{background:linear-gradient(90deg,var(--mo-orange-tint2) 50%,#e8ecf4 50%);color:var(--mo-graphite)}

/* células da timeline */
td.tcell{padding:0;min-width:var(--cell-w);max-width:var(--cell-w);height:44px;border-right:1px solid #eef0f3;position:relative}
.gantt tbody tr{height:44px}
td.tcell.fds{background:repeating-linear-gradient(135deg,#f2f4f6 0 4px,#e9ecef 4px 8px)}
td.tcell.hoje{box-shadow:inset 2px 0 0 var(--mo-ink), inset -1px 0 0 rgba(20,22,26,.15)}
.bar{
  position:absolute;top:50%;height:20px;transform:translateY(-50%);
  left:3px;right:3px;border-radius:7px;z-index:1;
}
.bar.start{border-top-left-radius:9px;border-bottom-left-radius:9px}
.bar.end{border-top-right-radius:9px;border-bottom-right-radius:9px}
.bar.mid{left:0;right:-1px;border-radius:0}
.bar.start:not(.end){right:-1px}
.bar.end:not(.start){left:0}
.bar.nao_iniciado{background:#c4cad2}
.bar.em_andamento{background:linear-gradient(180deg,#fdd9ac,#fdc585)}
.bar.concluido{background:linear-gradient(180deg,#2aa15e,var(--mo-success))}
.bar.risco{background:linear-gradient(180deg,#d4554a,var(--mo-danger))}

/* status chip clicável */
.status-chip{
  display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;
  font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
  transition:transform .12s ease;user-select:none;white-space:nowrap;
}
.status-chip:active{transform:scale(.94)}
.status-chip::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-nao_iniciado{background:#eef0f3;color:#6f7886}
.st-em_andamento{background:var(--mo-orange-tint);color:var(--mo-orange)}
.st-concluido{background:var(--mo-success-bg);color:var(--mo-success)}
.st-risco{background:var(--mo-danger-bg);color:var(--mo-danger)}
.col-status{min-width:128px}

/* grupo de serviço (linha separadora) */
tr.group-row td{
  background:var(--mo-panel)!important;font-size:.68rem;font-weight:800;text-transform:uppercase;
  letter-spacing:.12em;color:var(--mo-graphite);padding:6px 12px;border-bottom:1px solid var(--mo-line);
}
tr.group-row td.tcell-strip{padding:0}

/* ============ RESUMO GERAL ============ */
.resumo-row-nome{font-weight:800;color:var(--mo-ink);font-size:.82rem;line-height:1.25}
.resumo-row-obj{color:var(--mo-mist);font-weight:500;font-size:.72rem;margin-top:2px}
.resumo-esp{margin-top:4px;font-size:.68rem;color:var(--mo-orange);font-weight:700}
.progress-wrap{display:flex;align-items:center;gap:8px}
.progress-track{flex:1;height:7px;background:var(--mo-panel);border-radius:99px;overflow:hidden;min-width:60px}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#fdd9ac,#fb8b24)}
.progress-fill.done{background:var(--mo-success)}
.progress-num{font-size:.7rem;font-weight:800;color:var(--mo-graphite);min-width:34px;text-align:right}
.rcol-nome{left:0;min-width:250px;max-width:250px}
.rcol-resp{left:250px;min-width:150px;max-width:150px}
.rcol-ini{left:400px;min-width:58px;max-width:58px}
.rcol-fim{left:458px;min-width:58px;max-width:58px}
.rcol-dias{left:516px;min-width:46px;max-width:46px}
.rcol-prog{left:562px;min-width:150px;max-width:150px;border-right:2px solid var(--mo-line)!important}

/* stats do resumo */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.stat{background:var(--mo-white);border-radius:16px;padding:18px 20px;box-shadow:var(--mo-shadow-sm);position:relative;overflow:hidden}
.stat .k{font-size:.66rem;font-weight:800;text-transform:uppercase;letter-spacing:.13em;color:var(--mo-slate)}
.stat .v{font-size:1.7rem;font-weight:800;letter-spacing:-.02em;margin-top:4px}
.stat .sub{font-size:.72rem;color:var(--mo-mist);font-weight:600;margin-top:2px}
.stat.accent{background:linear-gradient(135deg,var(--mo-orange),var(--mo-orange-soft));color:var(--mo-white)}
.stat.accent .k{color:rgba(255,255,255,.8)}
.stat.accent .sub{color:rgba(255,255,255,.85)}

footer{
  max-width:1600px;margin:0 auto;padding:10px 32px 34px;display:flex;justify-content:space-between;
  align-items:center;color:var(--mo-slate);font-size:.72rem;font-weight:600;
}
footer img{height:16px;opacity:.5;filter:grayscale(1)}

/* ============ TOOLBAR / MODO EDIÇÃO ============ */
.toolbar{display:flex;justify-content:flex-end;align-items:center;gap:16px;margin-top:14px;flex-wrap:wrap}
.switch-wrap{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch-wrap input{display:none}
.switch{width:42px;height:24px;border-radius:99px;background:#d5dae1;position:relative;transition:background .2s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch-wrap input:checked + .switch{background:var(--mo-orange)}
.switch-wrap input:checked + .switch::after{left:21px}
.switch-label{font-size:.82rem;font-weight:700;color:var(--mo-graphite)}
.btn-ghost{font-size:.76rem;font-weight:700;color:var(--mo-slate);padding:8px 12px;border-radius:10px}
.btn-ghost:hover{background:var(--mo-panel);color:var(--mo-graphite)}

/* affordances no modo edição */
body.edit-on .gantt tbody tr td.sticky{cursor:pointer}
body.edit-on .gantt tbody tr:hover td.sticky{background:var(--mo-orange-tint)}
.row-actions{display:flex;gap:4px;margin-bottom:5px}
.icon-btn{width:24px;height:24px;border-radius:7px;background:var(--mo-panel);color:var(--mo-graphite);font-size:.72rem;font-weight:800;display:flex;align-items:center;justify-content:center;transition:all .15s}
.icon-btn:hover{background:var(--mo-orange);color:#fff}
.add-activity{display:block;margin:14px;padding:11px 18px;border:1.5px dashed var(--mo-orange-soft);color:var(--mo-orange);border-radius:12px;font-weight:800;font-size:.8rem;background:var(--mo-white)}
.add-activity:hover{background:var(--mo-orange-tint)}
.edit-eixo-btn{display:inline-flex;align-items:center;gap:6px;margin-left:12px;padding:6px 12px;border-radius:10px;background:var(--mo-orange-tint);color:var(--mo-orange);font-size:.72rem;font-weight:800;vertical-align:middle}
.edit-eixo-btn:hover{background:var(--mo-orange-tint2)}
.empty-state{padding:44px;text-align:center;color:var(--mo-slate);font-weight:600;font-size:.88rem}

/* ============ MODAL ============ */
.overlay{position:fixed;inset:0;background:rgba(20,22,26,.5);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
.overlay.open{display:flex}
.modal{background:var(--mo-white);border-radius:var(--mo-radius);max-width:580px;width:100%;padding:28px;box-shadow:var(--mo-shadow);max-height:92vh;overflow:auto}
.modal .eyebrow{margin-bottom:4px}
.modal h3{font-size:1.2rem;font-weight:800;letter-spacing:-.01em}
.field{margin-top:16px}
.field label{display:block;font-size:.68rem;font-weight:800;text-transform:uppercase;letter-spacing:.12em;color:var(--mo-slate);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field textarea,.field select{
  width:100%;border:1.5px solid var(--mo-line);border-radius:12px;padding:10px 13px;font-family:inherit;
  font-size:.88rem;font-weight:600;color:var(--mo-ink);background:var(--mo-bg);outline:none;transition:border .15s;
}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--mo-orange);background:var(--mo-white)}
.field textarea{resize:vertical;min-height:70px}
.field .help{font-size:.7rem;color:var(--mo-slate);font-weight:500;margin-top:5px}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.modal-actions{display:flex;gap:10px;margin-top:24px;justify-content:flex-end;align-items:center}
.btn{padding:11px 20px;border-radius:12px;font-weight:800;font-size:.84rem;transition:all .15s}
.btn-primary{background:var(--mo-orange);color:#fff;box-shadow:0 6px 16px rgba(232,93,4,.3)}
.btn-primary:hover{background:var(--mo-orange-strong)}
.btn-sec{background:var(--mo-panel);color:var(--mo-graphite)}
.btn-sec:hover{background:var(--mo-line)}
.btn-danger{background:var(--mo-danger-bg);color:var(--mo-danger);margin-right:auto}
.btn-danger:hover{background:#f5d7d3}

/* ============ TOAST ============ */
.toast{position:fixed;bottom:26px;left:50%;transform:translate(-50%,10px);background:var(--mo-ink);color:#fff;padding:12px 22px;border-radius:12px;font-weight:700;font-size:.8rem;opacity:0;transition:all .25s;z-index:60;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ============ PORTAL DE LOGIN ============ */
body:not(.authed) .hero, body:not(.authed) .shell, body:not(.authed) footer{display:none}
.login-wrap{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px;
  background:linear-gradient(135deg,#fbfcfd 0%,#fff4ea 48%,#fde7cf 100%);
}
body.authed .login-wrap{display:none}
.login-card{
  background:var(--mo-white);border-radius:26px;box-shadow:var(--mo-shadow);
  max-width:440px;width:100%;padding:42px 42px 30px;text-align:center;position:relative;overflow:hidden;
}
.login-card::before{content:"";position:absolute;top:0;left:0;right:0;height:8px;
  background:linear-gradient(90deg,var(--mo-orange),var(--mo-orange-soft))}
.login-card img.cliente-logo{max-height:92px;max-width:260px;object-fit:contain;margin:0 auto 20px;display:block}
.badge-projeto{
  display:inline-block;background:var(--mo-panel);color:var(--mo-graphite);border-radius:999px;
  padding:6px 16px;font-size:.66rem;font-weight:800;letter-spacing:.16em;margin-bottom:18px;
}
.login-card h2{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.login-card h2 span{color:var(--mo-orange)}
.login-sub{font-size:.84rem;color:var(--mo-mist);font-weight:500;margin-top:6px;margin-bottom:22px}
.lfield{text-align:left;margin-top:14px}
.lfield label{display:block;font-size:.72rem;font-weight:800;color:var(--mo-graphite);margin-bottom:6px}
.lfield input{
  width:100%;border:1.5px solid var(--mo-line);border-radius:14px;padding:12px 15px;font-family:inherit;
  font-size:.9rem;font-weight:600;color:var(--mo-ink);outline:none;transition:all .15s;background:var(--mo-white);
}
.lfield input:focus{border-color:var(--mo-orange);background:var(--mo-orange-tint);box-shadow:0 0 0 3px rgba(232,93,4,.12)}
.senha-wrap{position:relative}
.senha-wrap input{padding-right:56px}
.ver-btn{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:.76rem;font-weight:700;color:var(--mo-slate)}
.ver-btn:hover{color:var(--mo-orange)}
.login-erro{
  display:none;margin-top:12px;background:var(--mo-danger-bg);color:var(--mo-danger);border-radius:10px;
  padding:9px 13px;font-size:.78rem;font-weight:700;text-align:left;
}
.login-erro.show{display:block}
.btn-entrar{
  width:100%;margin-top:20px;padding:14px;border-radius:999px;font-size:.94rem;font-weight:800;color:#fff;
  background:linear-gradient(90deg,#c94f00,var(--mo-orange) 45%,var(--mo-orange-soft));
  box-shadow:0 10px 24px rgba(232,93,4,.32);transition:all .18s;
}
.btn-entrar:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(232,93,4,.4)}
.login-foot{margin-top:26px;padding-top:18px;border-top:1px solid var(--mo-line);display:flex;flex-direction:column;align-items:center;gap:5px}
.login-foot img{height:20px}
.login-foot span{font-size:.72rem;font-weight:700;color:var(--mo-graphite)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.login-card.shake{animation:shake .4s}

/* ============ SESSÃO NO HERO ============ */
.hero-right{display:flex;align-items:center;gap:16px;flex-wrap:wrap;justify-content:flex-end}
.session{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.user-chip{display:inline-flex;align-items:center;gap:9px;background:rgba(255,255,255,.16);border-radius:999px;padding:5px 15px 5px 5px;font-size:.8rem;font-weight:700;color:#fff}
.user-avatar{width:27px;height:27px;border-radius:50%;background:#fff;color:var(--mo-orange);display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:800}
.role-badge{font-size:.6rem;font-weight:800;letter-spacing:.1em;padding:6px 12px;border-radius:999px;background:#fff;color:var(--mo-orange)}
.role-badge.cliente{background:rgba(255,255,255,.2);color:#fff}
.sync-badge{font-size:.62rem;font-weight:800;letter-spacing:.06em;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.14);color:#fff;display:none}
body.authed .sync-badge{display:inline-block}
.sync-badge.ok{background:rgba(255,255,255,.9);color:var(--mo-success)}
.sync-badge.salvando{background:rgba(255,255,255,.9);color:var(--mo-warning)}
.sync-badge.erro{background:#fff;color:var(--mo-danger)}
.sync-badge.rascunho{background:#fff;color:var(--mo-warning)}
.btn-mini{padding:9px 16px!important;font-size:.78rem!important;border-radius:11px!important}
.btn-sair{border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:6px 17px;font-size:.76rem;font-weight:700;transition:all .15s}
.btn-sair:hover{background:#fff;color:var(--mo-orange)}

/* permissões */
body:not(.role-admin) .toolbar{display:none}
body.role-cliente .status-chip{pointer-events:none}
body.role-cliente .legend .hint{display:none}
.toolbar{justify-content:space-between}
.toolbar-group{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.cfg-logo-preview{max-height:56px;max-width:200px;object-fit:contain;margin-top:10px;border:1px solid var(--mo-line);border-radius:10px;padding:6px;background:#fff;display:block}

@media (max-width:900px){
  .hero{padding:20px 18px 70px}
  .shell{padding:0 14px}
  .hero-title h1{font-size:1.05rem}
  .client-chip img{height:38px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-card" id="loginCard">
    <img class="cliente-logo" id="loginLogoCliente" src="" alt="Cliente">
    <h2>Acesso <span>restrito</span></h2>
    <p class="login-sub">Identifique-se para acessar o cronograma.</p>
    <div class="lfield">
      <label for="loginNome">Seu nome</label>
      <input type="text" id="loginNome" placeholder="Como você quer ser identificado" autocomplete="name">
    </div>
    <div class="lfield">
      <label for="loginSenha">Senha</label>
      <div class="senha-wrap">
        <input type="password" id="loginSenha" placeholder="Senha do grupo" autocomplete="current-password">
        <button type="button" class="ver-btn" id="verSenha">Ver</button>
      </div>
    </div>
    <div class="login-erro" id="loginErro"></div>
    <button class="btn-entrar" id="btnEntrar">Entrar</button>
    <div class="login-foot">
      <img id="loginLogoMolla" src="" alt="Molla">
      <span>Agência Molla</span>
    </div>
  </div>
</div>

<header class="hero">
  <div class="hero-inner">
    <div class="hero-brand">
      <img class="molla" id="logoMolla" src="" alt="Molla">
      <div class="hero-divider"></div>
      <div class="hero-title">
        <h1 id="tituloProjeto">Cronograma do Projeto</h1>
        <p>Trade Marketing · Incentivo · Comunicação</p>
      </div>
    </div>
    <div class="hero-right">
      <div class="client-chip" id="clientChip">
        <img id="logoCliente" src="" alt="Cliente">
      </div>
      <div class="session">
        <span class="user-chip"><span class="user-avatar" id="userAvatar"></span><span id="userNome"></span></span>
        <span class="role-badge" id="roleBadge"></span>
        <span class="sync-badge" id="syncBadge"></span>
        <button class="btn-sair" id="btnSair">Sair</button>
      </div>
    </div>
  </div>
</header>

<div class="shell">
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar">
    <div class="toolbar-group">
      <button class="btn btn-primary btn-mini" id="saveBtn">Salvar alterações</button>
      <button class="btn-ghost" id="restoreBtn">Restaurar última versão salva</button>
      <button class="btn-ghost" id="cfgBtn">Configurações do cliente</button>
      <button class="btn-ghost" id="projBtn">Configurações do projeto</button>
      <button class="btn-ghost" id="gabBtn">Gabaritos</button>
      <button class="btn-ghost" id="expBtn">Exportar JSON</button>
      <button class="btn-ghost" id="impBtn">Importar JSON</button>
      <button class="btn-ghost" id="copiaBtn">Baixar cópia (HTML)</button>
      <input type="file" id="impFile" accept=".json,application/json" style="display:none">
    </div>
    <div class="toolbar-group">
      <label class="switch-wrap">
        <input type="checkbox" id="editToggle">
        <span class="switch"></span>
        <span class="switch-label">Modo edição</span>
      </label>
      <button class="btn-ghost" id="resetBtn">Restaurar dados originais</button>
    </div>
  </div>
  <main id="views"></main>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<footer>
  <span>Modelo whitelabel · Agência Molla</span>
  <span id="footerRange"></span>
</footer>

/* ============ utilidades de data ============ */
const MESES = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
const DOW   = ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const D = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const addDays = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diffDays = (a,b) => Math.round((b-a)/864e5);
const br = s => { const [y,m,d] = s.split('-'); return `${d}/${m}`; };
const brFull = s => { const [y,m,d] = s.split('-'); return `${d}/${m}/${y.slice(2)}`; };

const TIPOS = ['Planejamento','Aprova\u00e7\u00e3o','Produ\u00e7\u00e3o','Execu\u00e7\u00e3o','Apura\u00e7\u00e3o','Outro'];
function inferirTipo(a){
  const t = ((a.atividade||'') + ' ' + (a.descricao||'')).toLowerCase();
  if (t.includes('aprova')) return 'Aprova\u00e7\u00e3o';
  if (t.includes('planej') || t.includes('defini') || t.includes('mec\u00e2nica') || t.includes('mecanica') || t.includes('regra')) return 'Planejamento';
  if (t.includes('apura') || t.includes('resultado') || t.includes('relat\u00f3rio') || t.includes('relatorio') || t.includes('mensura')) return 'Apura\u00e7\u00e3o';
  if (t.includes('produ\u00e7') || t.includes('produc') || t.includes('cria\u00e7') || t.includes('criac') || t.includes('desenvolv') || t.includes('layout') || t.includes('arte')) return 'Produ\u00e7\u00e3o';
  return 'Execu\u00e7\u00e3o';
}
/* ============ dias úteis ============ */
function ehDiaUtil(d){ const g = d.getDay(); return g !== 0 && g !== 6; }
function proximoDiaUtil(d){ d = new Date(d); while (!ehDiaUtil(d)) d = addDays(d, 1); return d; }
function addDiasUteis(d, n){
  let x = proximoDiaUtil(d), r = Math.max(1, n) - 1;
  while (r > 0){ x = addDays(x, 1); if (ehDiaUtil(x)) r--; }
  return x;
}
function diasUteisEntre(aIso, bIso){
  let d = D(aIso), f = D(bIso), n = 0;
  while (d <= f){ if (ehDiaUtil(d)) n++; d = addDays(d, 1); }
  return Math.max(1, n);
}

/* agenda um gabarito a partir de uma data de início (encadeando no mesmo dia útil) */
function planejarGabarito(gab, S){
  const itens = [];
  gab.atividades.forEach(t => {
    let ini = (t.dep != null && itens[t.dep]) ? new Date(itens[t.dep].fimD) : new Date(S);
    ini = proximoDiaUtil(ini);
    itens.push({ t, iniD: ini, fimD: addDiasUteis(ini, t.sla) });
  });
  return itens;
}
function fimPlano(itens){ return itens.reduce((m, x) => x.fimD > m ? x.fimD : m, itens[0].fimD); }

/* retro-planejamento: dado o alvo, calcula início ideal ou o fim viável partindo de hoje */
function retroPlanejar(gab, alvoIso){
  const alvo = D(alvoIso);
  const hojeUtil = proximoDiaUtil(D(HOJE));
  const deHoje = planejarGabarito(gab, hojeUtil);
  const fimViavel = fimPlano(deHoje);
  if (fimViavel > alvo){
    return { entregavel: false, itens: deHoje, fimViavel, atraso: diasUteisEntre(iso(alvo), iso(fimViavel)) - 1 };
  }
  let ideal = new Date(hojeUtil), tent = new Date(hojeUtil), guard = 0;
  while (guard++ < 900){
    tent = addDays(tent, 1);
    if (!ehDiaUtil(tent)) continue;
    if (fimPlano(planejarGabarito(gab, tent)) <= alvo) ideal = new Date(tent);
    else break;
  }
  const itens = planejarGabarito(gab, ideal);
  return { entregavel: true, itens, inicioIdeal: ideal, fimIdeal: fimPlano(itens), folga: diasUteisEntre(iso(hojeUtil), iso(ideal)) - 1 };
}

/* atividades que dependem (direta ou indiretamente) de "alvo" — para evitar ciclos */
function dependentesDe(e, alvoId){
  const bloqueadas = new Set([alvoId]);
  let mudou = true;
  while (mudou){
    mudou = false;
    e.atividades.forEach(a => {
      if (a.dep && bloqueadas.has(a.dep) && !bloqueadas.has(a.id)){
        bloqueadas.add(a.id); mudou = true;
      }
    });
  }
  return bloqueadas;
}

/* reagenda em cascata: dependente s\u00f3 inicia ap\u00f3s o fim da atividade-base */
function recalcularDependencias(e){
  let total = 0, guarda = 0, mudou = true;
  const movidas = new Set();
  while (mudou && guarda++ < 60){
    mudou = false;
    e.atividades.forEach(a => {
      if (!a.dep) return;
      const b = e.atividades.find(x => x.id === a.dep);
      if (!b){ a.dep = null; return; }
      const minInicio = b.fim; /* pode iniciar no mesmo dia do fim da atividade-base */
      if (a.inicio < minInicio){
        const dur = diffDays(D(a.inicio), D(a.fim));
        a.inicio = minInicio;
        a.fim = iso(addDays(D(minInicio), dur));
        if (!movidas.has(a.id)){ movidas.add(a.id); total++; }
        mudou = true;
      }
    });
  }
  return total;
}

/* range global (para resumo) e por eixo */
function rangeOf(atividades){
  let min=null, max=null;
  if (!atividades.length) return {min:null, max:null};
  atividades.forEach(a => {
    if (!min || a.inicio < min) min = a.inicio;
    if (!max || a.fim > max) max = a.fim;
  });
  return {min, max};
}
function buildDays(minIso, maxIso, padEnd=2){
  const days = [];
  let d = D(minIso);
  const end = addDays(D(maxIso), padEnd);
  while (d <= end){ days.push(new Date(d)); d = addDays(d,1); }
  return days;
}

}

/* ============ HEADER da régua (3 linhas: mês / dow / data) ============ */
function timelineHeaderCells(days){
  const LIM = limiteProjeto();
  let html = '';
  days.forEach((d,i) => {
    const dow = d.getDay();
    const fds = (dow===0 || dow===6) ? ' fds' : '';
    const dIso = iso(d);
    const today = (dIso===HOJE ? ' hoje' : '') + (LIM && dIso===LIM ? ' limite' : '');
    const isFirstOfBlock = i===0 || d.getDate()===1;
    const monthLabel = isFirstOfBlock ? MESES[d.getMonth()] : '';
    html += `<th class="tl-head tl-col${fds}${today}">
      <div class="tl-month">${monthLabel}</div>
      <div class="tl-dow">${DOW[dow]}</div>
      <div class="tl-date">${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}</div>
    </th>`;
  });
  return html;
}

/* ============ células de barra ============ */
function barCells(days, aIni, aFim, status){
  const LIM = limiteProjeto();
  let html = '';
  days.forEach(d => {
    const dIso = iso(d);
    const dow = d.getDay();
    const fds = (dow===0 || dow===6) ? ' fds' : '';
    const today = (dIso===HOJE ? ' hoje' : '') + (LIM && dIso===LIM ? ' limite' : '');
    let bar = '';
    if (dIso >= aIni && dIso <= aFim){
      const cls = [];
      if (dIso === aIni) cls.push('start');
      if (dIso === aFim) cls.push('end');
      if (!cls.length) cls.push('mid');
      bar = `<div class="bar ${cls.join(' ')} ${status}"></div>`;
    }
    html += `<td class="tcell${fds}${today}">${bar}</td>`;
  });
  return html;
}

/* ============ RESUMO GERAL (gerado automaticamente) ============ */
function eixoProgresso(e){
  const total = e.atividades.length;
  if (!total) return 0;
  const score = e.atividades.reduce((s,a)=> s + (a.status==='concluido'?1: a.status==='em_andamento'?0.5:0), 0);
  return Math.round(100 * score / total);
}

function renderResumo(){
  const eixosComDados = state.eixos.filter(e => e.atividades.length);
  const all = eixosComDados.flatMap(e => e.atividades);
  if (!all.length){
    const v = document.createElement('section');
    v.className = 'view'; v.id = 'view-resumo';
    v.innerHTML = '<div class="card"><div class="empty-state">Nenhuma atividade cadastrada ainda. Ative o Modo edição e adicione atividades nas abas de eixo.</div></div>';
    viewsEl.appendChild(v);
    return;
  }
  const g = rangeOf(all);
  const LIM = limiteProjeto();
  const fimGrade = (LIM && LIM > g.max) ? LIM : g.max;
  const days = buildDays(g.min, fimGrade, 2);
  const totalDias = diffDays(D(g.min), D(g.max)) + 1;

  const nAtiv = all.length;
  const nConcl = all.filter(a=>a.status==='concluido').length;
  const nAnd = all.filter(a=>a.status==='em_andamento').length;
  const nRisco = all.filter(a=>a.status==='risco').length;
  const progGeral = Math.round(100 * all.reduce((s,a)=> s + (a.status==='concluido'?1: a.status==='em_andamento'?0.5:0), 0) / nAtiv);

  let rows = '';
  eixosComDados.forEach(e => {
    const r = rangeOf(e.atividades);
    const dias = diffDays(D(r.min), D(r.max)) + 1;
    const prog = eixoProgresso(e);
    const resps = [...new Set(e.atividades.map(a=>a.responsavel))].join(' · ');
    rows += `<tr>
      <td class="sticky rcol-nome">
        <div class="resumo-row-nome">${e.nome}</div>
        <div class="resumo-row-obj">${e.objetivo}</div>
        <div class="resumo-esp">${e.especialistas.join(' · ')}</div>
      </td>
      <td class="sticky rcol-resp"><span style="font-size:.7rem;font-weight:600;color:var(--mo-mist)">${resps}</span></td>
      <td class="sticky rcol-ini cell-dt">${br(r.min)}</td>
      <td class="sticky rcol-fim cell-dt">${br(r.max)}</td>
      <td class="sticky rcol-dias cell-dias">${dias}</td>
      <td class="sticky rcol-prog">
        <div class="progress-wrap">
          <div class="progress-track"><div class="progress-fill${prog===100?' done':''}" style="width:${prog}%"></div></div>
          <div class="progress-num">${prog}%</div>
        </div>
      </td>
      ${barCells(days, r.min, r.max, prog===100 ? 'concluido' : (e.atividades.some(a=>a.status==='risco') ? 'risco' : (prog>0 ? 'em_andamento' : 'nao_iniciado')))}
    </tr>`;
  });

  const v = document.createElement('section');
  v.className = 'view';
  v.id = 'view-resumo';
  v.innerHTML = `
    <div class="stats">
      <div class="stat accent"><div class="k">Período do projeto</div><div class="v">${totalDias} dias</div><div class="sub">${brFull(g.min)} → ${brFull(g.max)}</div></div>
      <div class="stat"><div class="k">Eixos ativos</div><div class="v">${state.eixos.length}</div><div class="sub">${nAtiv} atividades no total</div></div>
      <div class="stat"><div class="k">Concluídas</div><div class="v" style="color:var(--mo-success)">${nConcl}</div><div class="sub">de ${nAtiv} atividades</div></div>
      <div class="stat"><div class="k">Em andamento</div><div class="v" style="color:var(--mo-orange)">${nAnd}</div><div class="sub">${nRisco} em risco</div></div>
      ${(() => {
        const LIM2 = limiteProjeto();
        if (!LIM2) return '';
        const nEstouro = all.filter(a => a.fim > LIM2).length;
        const faltam = diffDays(D(HOJE), D(LIM2));
        const ok = nEstouro === 0;
        const fimReal = fimProjetoAtual();
        const diasAcima = ok ? 0 : diffDays(D(LIM2), D(fimReal));
        return `<div class="stat"><div class="k">Limite do projeto</div>
          <div class="v" style="color:${ok ? 'var(--mo-ink)' : 'var(--mo-danger)'}">${br(LIM2)}</div>
          <div class="sub" style="${ok ? '' : 'color:var(--mo-danger);font-weight:800'}">${ok ? (faltam >= 0 ? 'faltam ' + faltam + ' dias' : 'prazo encerrado') : nEstouro + ' atividade(s) al\u00e9m \u00b7 ' + diasAcima + ' dia(s) acima do limite'}</div>
          ${ok ? '' : `<div class="sub" style="font-weight:800;color:var(--mo-graphite)">Sugest\u00e3o de limite: ${br(fimReal)} (fim real do cronograma)</div>`}
        </div>`;
      })()}
      <div class="stat"><div class="k">Progresso geral</div><div class="v" style="color:${progGeral===100?'var(--mo-success)':'var(--mo-orange)'}">${progGeral}%</div>
        <div class="progress-track" style="margin-top:9px"><div class="progress-fill${progGeral===100?' done':''}" style="width:${progGeral}%"></div></div>
      </div>
    </div>

    <div class="card" style="margin-top:22px">
      <div class="eyebrow">Painel geral das ações</div>
      <h2 style="font-size:1.3rem;font-weight:800;letter-spacing:-.02em">Visão consolidada por eixo</h2>
      <p style="color:var(--mo-mist);font-size:.86rem;font-weight:500;margin-top:6px">Este painel é montado automaticamente a partir das abas de eixo — qualquer alteração nos eixos se reflete aqui.</p>
      ${legendHtml()}
    </div>

    <div class="card gantt-card">
      <div class="gantt-scroll">
        <table class="gantt">
          <thead><tr>
            <th class="sticky rcol-nome">Eixo / Projeto</th>
            <th class="sticky rcol-resp">Responsáveis</th>
            <th class="sticky rcol-ini">Início</th>
            <th class="sticky rcol-fim">Fim</th>
            <th class="sticky rcol-dias">Dias</th>
            <th class="sticky rcol-prog">Progresso</th>
            ${timelineHeaderCells(days)}
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>`;
  viewsEl.appendChild(v);

  document.getElementById('footerRange').textContent = `Período: ${brFull(g.min)} a ${brFull(g.max)} · Hoje: ${brFull(HOJE)}`;
}

function legendHtml(){
  return `<div class="legend">
    <div class="item"><span class="dot concluido"></span>Concluído</div>
    <div class="item"><span class="dot andamento"></span>Em andamento</div>
    <div class="item"><span class="dot nao"></span>Não iniciado</div>
    <div class="item"><span class="dot risco"></span>Risco</div>
    <div class="item"><span class="dot fds"></span>Fim de semana</div>
    <div class="item"><span class="dot hoje"></span>Hoje</div>
    ${(() => {
      const L = limiteProjeto();
      if (!L) return '';
      const fimReal = fimProjetoAtual();
      const estouro = fimReal && fimReal > L;
      return `<div class="item"><span class="dot limite"></span>Limite do projeto (${br(L)})${estouro ? ` \u00b7 <span style="color:var(--mo-danger);font-weight:800">sugerido: ${br(fimReal)}</span>` : ''}</div>`;

}

/* ============ EIXO ============ */

  let rows = '';

      <td class="sticky col-desc cell-desc" title="${a.descricao.replace(/"/g,'&quot;')}"><span class="clamp">${a.descricao}</span></td>
      <td class="sticky col-resp"><span class="resp-tag ${respClass(a.responsavel)}">${a.responsavel}</span></td>
      <td class="sticky col-ini cell-dt">${br(a.inicio)}</td>
      <td class="sticky col-fim cell-dt${LIM && a.fim > LIM ? ' estouro' : ''}"${LIM && a.fim > LIM ? ' title="Ultrapassa o limite do projeto ('+brFull(LIM)+')"' : ''}>${br(a.fim)}</td>

  v.innerHTML = `
    <div class="card">
      <div class="eixo-meta">
        <div class="meta-main">
          <div class="eyebrow">${e.aba}</div>
          <h2>${e.nome}${editMode ? `<button class="edit-eixo-btn" data-edit-eixo="${e.id}">✎ Editar eixo</button><button class="edit-eixo-btn" data-dup-eixo="${e.id}">⧉ Duplicar eixo</button><button class="edit-eixo-btn" data-sort-eixo="${e.id}" title="Reordena as atividades por data de início e, em empates, pela sequência natural dos tipos">⇅ Ordenar por data e tipo</button>` : ''}</h2>
          <div class="objetivo">${e.objetivo}</div>
          ${e.obs && e.obs.length ? e.obs.map(o=>`<div class="obs">${o}</div>`).join(' ') : ''}
          <div class="especialistas">
            <span class="k">Especialistas Molla</span>
            ${e.especialistas.map(n=>`<span class="esp-chip"><span class="avatar">${iniciais(n)}</span>${n}</span>`).join('')}
          </div>
        </div>
        <div class="meta-side">
          <div class="meta-pill"><div class="k">Início</div><div class="v">${brFull(r.min)}</div></div>
          <div class="meta-pill"><div class="k">Fim</div><div class="v">${brFull(r.max)}</div></div>
          <div class="meta-pill"><div class="k">Dias</div><div class="v">${dias}</div></div>
          <div class="meta-pill"><div class="k">Progresso</div><div class="v" style="color:${prog===100?'var(--mo-success)':'var(--mo-orange)'}">${prog}%</div></div>

          <thead><tr>
            <th class="sticky col-num">#</th>
            <th class="sticky col-ativ">Atividade</th>
            <th class="sticky col-desc">Descrição</th>
            <th class="sticky col-resp">Resp.</th>

/* ============ arrastar e soltar (reordenar atividades) ============ */
let dragInfo = null;
document.addEventListener('dragstart', ev => {
  const card = ev.target.closest && ev.target.closest('.kb-card[data-kb-act]');
  if (card){
    if (!session || session.role !== 'admin'){ ev.preventDefault && ev.preventDefault(); return; }
    dragInfo = { kb: true, eixo: card.dataset.kbEixo, act: card.dataset.kbAct };
    card.classList.add('dragging');
    if (ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', card.dataset.kbAct); } catch(e){} }
    return;
  }
  const tr = ev.target.closest && ev.target.closest('tr[data-act]');
  if (!tr || !editMode){ ev.preventDefault && ev.preventDefault(); return; }
  dragInfo = { eixo: tr.dataset.eixo, act: tr.dataset.act };
  tr.classList.add('dragging');
  if (ev.dataTransfer){ ev.dataTransfer.effectAllowed = 'move'; try { ev.dataTransfer.setData('text/plain', tr.dataset.act); } catch(e){} }
});
document.addEventListener('dragover', ev => {
  if (!dragInfo) return;
  if (dragInfo.kb){
    const col = ev.target.closest && ev.target.closest('.kb-col[data-kb-status]');
    if (!col) return;
    ev.preventDefault();
    document.querySelectorAll('.kb-col.alvo').forEach(x => x.classList.remove('alvo'));
    col.classList.add('alvo');
    return;
  }
  const tr = ev.target.closest && ev.target.closest('tr[data-act]');
  if (!tr || tr.dataset.eixo !== dragInfo.eixo) return;
  ev.preventDefault();
  document.querySelectorAll('tr.drop-alvo').forEach(x => x.classList.remove('drop-alvo'));
  if (tr.dataset.act !== dragInfo.act) tr.classList.add('drop-alvo');
});
document.addEventListener('drop', ev => {
  if (!dragInfo) return;
  if (dragInfo.kb){
    const col = ev.target.closest && ev.target.closest('.kb-col[data-kb-status]');
    if (col){ ev.preventDefault(); kbMover(dragInfo.eixo, dragInfo.act, col.dataset.kbStatus); }
    limparDrag();
    return;
  }
  const tr = ev.target.closest && ev.target.closest('tr[data-act]');
  if (tr && tr.dataset.eixo === dragInfo.eixo && tr.dataset.act !== dragInfo.act){
    ev.preventDefault();
    moverAtividadePara(dragInfo.eixo, dragInfo.act, tr.dataset.act);
  }
  limparDrag();
});
document.addEventListener('dragend', limparDrag);
function limparDrag(){
  dragInfo = null;
  document.querySelectorAll('tr.dragging, tr.drop-alvo, .kb-card.dragging').forEach(x => x.classList.remove('dragging','drop-alvo'));
  document.querySelectorAll('.kb-col.alvo').forEach(x => x.classList.remove('alvo'));
}
function moverAtividadePara(eixoId, actId, alvoId){
  const e = state.eixos.find(x => x.id === eixoId);
  if (!e) return;
  const de = e.atividades.findIndex(a => a.id === actId);
  const para = e.atividades.findIndex(a => a.id === alvoId);
  if (de < 0 || para < 0) return;
  const [item] = e.atividades.splice(de, 1);
  e.atividades.splice(para, 0, item);
  persist(); render();
}

/* ============ toast ============ */
let toastTimer = null;
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}

/* ============ modal ============ */
const overlay = document.getElementById('overlay');
const modalEl = document.getElementById('modal');
function closeModal(){ overlay.classList.remove('open'); modalEl.innerHTML=''; }
overlay.addEventListener('click', ev => { if (ev.target === overlay) closeModal(); });
document.addEventListener('keydown', ev => { if (ev.key === 'Escape') closeModal(); });

function esc(s){ return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

function respOptions(atual){
  const cli = state.cliente.nome;
  const padrao = ['Molla', cli, `Molla/${cli}`];
  const isOutro = atual && !padrao.includes(atual);
  return `
    <select id="f-resp">
      ${padrao.map(o=>`<option value="${esc(o)}" ${o===atual?'selected':''}>${esc(o)}</option>`).join('')}
      <option value="__outro__" ${isOutro?'selected':''}>Outro…</option>
    </select>
    <input type="text" id="f-resp-outro" placeholder="Digite o responsável" value="${isOutro?esc(atual):''}" style="margin-top:8px;display:${isOutro?'block':'none'}">`;
}

function openActivityModal(eixoId, actId){
  const e = state.eixos.find(x => x.id === eixoId);
  const a = actId ? e.atividades.find(x => x.id === actId) : null;
  const novo = !a;
  const base = a || { atividade:'', descricao:'', responsavel:'Molla', inicio:HOJE, fim:HOJE, status:'nao_iniciado', tipo:'Planejamento' };
  modalEl.innerHTML = `
    <div class="eyebrow">${esc(e.aba)} · ${esc(e.nome)}</div>
    <h3>${novo ? 'Nova atividade' : 'Editar atividade'}</h3>
    <div class="field"><label>Atividade (etapa)</label><input type="text" id="f-ativ" value="${esc(base.atividade)}" placeholder="Ex.: Planejamento"></div>
    <div class="field"><label>Descrição</label><textarea id="f-desc" placeholder="O que será feito nesta atividade">${esc(base.descricao)}</textarea></div>
    <div class="field field-row">
      <div><label>Tipo de atividade</label>
        <select id="f-tipo">${TIPOS.map(t=>`<option value="${t}" ${t===(base.tipo||'')?'selected':''}>${t}</option>`).join('')}</select>
      </div>
      <div><label>Responsável</label>${respOptions(base.responsavel)}</div>
    </div>
    <div class="field field-row">
      <div><label>Data início</label><input type="date" id="f-ini" value="${base.inicio}"></div>
      <div><label>Data fim</label><input type="date" id="f-fim" value="${base.fim}"></div>
    </div>
    <div class="field"><label>Status</label>
      <select id="f-status">${STATUS_ORDER.map(s=>`<option value="${s}" ${s===base.status?'selected':''}>${STATUS[s]}</option>`).join('')}</select>
    </div>
    <div class="field"><label>Condi\u00e7\u00e3o de in\u00edcio (depend\u00eancia)</label>
      <select id="f-dep">
        <option value="">Nenhuma \u2014 pode iniciar a qualquer momento</option>
        ${(() => {
          const bloqueadas = novo ? new Set() : dependentesDe(e, a.id);
          return e.atividades
            .filter(x => !bloqueadas.has(x.id))
            .map(x => `<option value="${x.id}" ${x.id===base.dep?'selected':''}>Ap\u00f3s concluir a n\u00ba ${e.atividades.indexOf(x)+1} \u2014 ${esc(x.atividade || x.descricao.slice(0,40))}</option>`)
            .join('');
        })()}
      </select>
      <div class="help">Esta atividade pode iniciar a partir do dia de conclus\u00e3o da escolhida (mesmo dia permitido, antes n\u00e3o). Se as datas da atividade-base mudarem, esta \u00e9 reagendada automaticamente em cascata.</div>
    </div>
    <label class="check"><input type="checkbox" id="f-marco" ${base.marco ? 'checked' : ''}> Marco de aprova\u00e7\u00e3o do cliente (destaque no cronograma)</label>
    <div class="modal-actions">
      ${novo ? '' : '<button class="btn btn-danger" id="f-del">Excluir atividade</button>'}
      <button class="btn btn-sec" id="f-cancel">Cancelar</button>
      <button class="btn btn-primary" id="f-save">${novo ? 'Adicionar' : 'Salvar alterações'}</button>
    </div>`;
  overlay.classList.add('open');

  const respSel = modalEl.querySelector('#f-resp');
  const respOutro = modalEl.querySelector('#f-resp-outro');
  respSel.onchange = () => { respOutro.style.display = respSel.value === '__outro__' ? 'block' : 'none'; };

  modalEl.querySelector('#f-cancel').onclick = closeModal;
  if (!novo) modalEl.querySelector('#f-del').onclick = () => {
    let orfas = 0;
    e.atividades.forEach(x => { if (x.dep === a.id){ x.dep = null; orfas++; } });
    e.atividades = e.atividades.filter(x => x.id !== a.id);
    registrarLog('Excluiu atividade "' + (a.atividade || '?') + '" de ' + e.aba);
    persist(); closeModal(); render();
    toast('Atividade excluída' + (orfas ? ' \u00b7 ' + orfas + ' depend\u00eancia(s) removida(s)' : ''));
  };
  modalEl.querySelector('#f-save').onclick = () => {
    const ativ = modalEl.querySelector('#f-ativ').value.trim();
    const desc = modalEl.querySelector('#f-desc').value.trim();
    let resp = respSel.value === '__outro__' ? respOutro.value.trim() : respSel.value;
    let ini = modalEl.querySelector('#f-ini').value;
    let fim = modalEl.querySelector('#f-fim').value;
    if (!ativ && !desc){ toast('Preencha ao menos a atividade ou a descrição'); return; }
    if (!ini || !fim){ toast('Preencha as datas de início e fim'); return; }
    if (!resp) resp = 'Molla';
    let corrigiu = false;
    if (fim < ini){ [ini, fim] = [fim, ini]; corrigiu = true; }
    const LIM = limiteProjeto();
    if (LIM && fim > LIM){
      toast('A data fim (' + br(fim) + ') ultrapassa o limite do projeto (' + brFull(LIM) + '). Ajuste as datas ou o limite em Configura\u00e7\u00f5es do projeto.');
      return;
    }
    const depSel = modalEl.querySelector('#f-dep');
    const dados = { atividade: ativ, descricao: desc, responsavel: resp, inicio: ini, fim: fim, status: modalEl.querySelector('#f-status').value, tipo: modalEl.querySelector('#f-tipo').value, dep: depSel && depSel.value ? depSel.value : null, marco: modalEl.querySelector('#f-marco').checked };
    if (novo){
      e.atividades.push({ id: 'a' + Date.now(), ...dados });
    } else {
      Object.assign(a, dados);
    }
    const reagendadas = recalcularDependencias(e);
    registrarLog((novo ? 'Criou' : 'Editou') + ' atividade "' + (ativ || desc.slice(0,30)) + '" em ' + e.aba);
    persist(); closeModal(); render();
    let msg = corrigiu ? 'Salvo — as datas estavam invertidas e foram corrigidas' : (novo ? 'Atividade adicionada' : 'Alterações salvas');
    if (reagendadas) msg += ' \u00b7 ' + reagendadas + ' atividade(s) reagendada(s) pela depend\u00eancia';
    const LIM2 = limiteProjeto();
    if (LIM2){
      const nAlem = e.atividades.filter(x => x.fim > LIM2).length;
      if (nAlem) msg += ' \u00b7 \u26a0 ' + nAlem + ' atividade(s) al\u00e9m do limite do projeto';
    }
    toast(msg);
  };
}

function clonarAtividades(lista){
  const mapa = {};
  const novas = lista.map((a, i) => {
    const c = JSON.parse(JSON.stringify(a));
    mapa[a.id] = c.id = 'a' + Date.now() + '_' + i;
    return c;
  });
  novas.forEach(c => { if (c.dep) c.dep = mapa[c.dep] || null; });
  return novas;
}

function duplicarEixo(orig){
  const copia = JSON.parse(JSON.stringify(orig));
  copia.id = 'eixo' + Date.now();
  let abaNova = orig.aba + ' (c\u00f3pia)';
  let n = 2;
  while (state.eixos.some(x => x.aba.toLowerCase() === abaNova.toLowerCase())){
    abaNova = orig.aba + ' (c\u00f3pia ' + n + ')'; n++;
  }
  copia.aba = abaNova;
  copia.atividades = clonarAtividades(orig.atividades);
  state.eixos.push(copia);
  current = copia.id;
  registrarLog('Duplicou eixo ' + orig.aba + ' \u2192 ' + abaNova);
  persist(); render();
  toast('Eixo duplicado como "' + abaNova + '" \u2014 edite \u00e0 vontade');
}

function eixoParaGabarito(e){
  const idx = {};
  e.atividades.forEach((a, i) => idx[a.id] = i);
  const cli = state.cliente.nome.toLowerCase();
  return {
    id: 'gab-' + Date.now(),
    nome: e.nome,
    descricao: e.objetivo || '',
    atividades: e.atividades.map(a => {
      const r = (a.responsavel || '').toLowerCase();
      let resp = 'Molla';
      if (r.includes('molla') && (r.includes('/') || r.includes(cli))) resp = 'Molla/Cliente';
      else if (!r.includes('molla')) resp = 'Cliente';
      return {
        atividade: a.atividade,
        descricao: a.descricao,
        tipo: a.tipo || 'Execu\u00e7\u00e3o',
        responsavel: resp,
        sla: diasUteisEntre(a.inicio, a.fim),
        dep: (a.dep != null && idx[a.dep] != null) ? idx[a.dep] : null,
        marco: !!a.marco,
      };
    }),
  };
}

function proximaAba(){
  let n = state.eixos.length + 1;
  const existentes = new Set(state.eixos.map(x => x.aba.toLowerCase()));
  while (existentes.has(('eixo ' + n))) n++;
  return 'Eixo ' + n;
}

      <textarea id="f-obs" placeholder="Uma observação por linha (opcional)">${(e.obs||[]).map(esc).join('\n')}</textarea>

    <div class="modal-actions">

      const baseSel = modalEl.querySelector('#f-base');

/* ============ CALENDÁRIO ============ */
const MESES_FULL = ['janeiro','fevereiro','mar\u00e7o','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
let calAnchor = HOJE.slice(0, 7); /* 'YYYY-MM' */

function renderCalendario(){
  const [anoS, mesS] = calAnchor.split('-');
  const ano = Number(anoS), mes = Number(mesS) - 1;
  const primeiro = new Date(ano, mes, 1);
  const iniGrade = addDays(primeiro, -primeiro.getDay());
  const LIM = limiteProjeto();
  const todas = [];
  state.eixos.forEach(e => e.atividades.forEach(a => todas.push({ e, a })));

  let celulas = '';
  let d = new Date(iniGrade);
  for (let sem = 0; sem < 6; sem++){
    for (let i = 0; i < 7; i++){
      const dIso = iso(d);
      const doDia = todas.filter(x => x.a.inicio <= dIso && dIso <= x.a.fim);
      const cls = [
        d.getMonth() !== mes ? 'fora' : '',
        (d.getDay() === 0 || d.getDay() === 6) ? 'fds' : '',
        dIso === HOJE ? 'hoje' : '',
        LIM && dIso === LIM ? 'limite' : '',
      ].filter(Boolean).join(' ');
      const chips = doDia.slice(0, 2).map(x =>
        `<div class="cal-chip c-${x.a.status}" data-cal-eixo="${x.e.id}" data-cal-act="${x.a.id}" title="${esc(x.e.aba + ' \u00b7 ' + x.a.atividade + ' \u2014 ' + x.a.descricao + ' \u00b7 ' + br(x.a.inicio) + '\u2192' + br(x.a.fim))}">
          <div class="c1"><b>${esc(x.a.atividade || x.a.descricao.slice(0,20))}</b><span class="ce">${esc(x.e.aba)}</span></div>
          ${x.a.descricao ? `<div class="c2">${esc(x.a.descricao)}</div>` : ''}
        </div>`
      ).join('');
      const mais = doDia.length > 2 ? `<div class="cal-mais">+ ${doDia.length - 2} atividades</div>` : '';
      celulas += `<div class="cal-dia ${cls}"><div class="num">${d.getDate()}</div>${chips}${mais}</div>`;
      d = addDays(d, 1);
    }
  }

  const v = document.createElement('section');
  v.className = 'view';
  v.id = 'view-calendario';
  v.innerHTML = `
    <div class="card">
      <div class="cal-top">
        <div>
          <div class="eyebrow">Vis\u00e3o de calend\u00e1rio</div>
          <h3>${MESES_FULL[mes]} de ${ano}</h3>
        </div>
        <div class="cal-nav">
          <button data-cal="-1">\u2039 M\u00eas anterior</button>
          <button data-cal="0">Hoje</button>
          <button data-cal="1">Pr\u00f3ximo m\u00eas \u203a</button>
        </div>
      </div>
      <div class="cal-grid">
        ${DOW.map(x => `<div class="cal-dow">${x}</div>`).join('')}
        ${celulas}
      </div>
      ${legendHtml()}
    </div>`;
  viewsEl.appendChild(v);
}

/* ============ importação em massa ============ */
function parseDataFlex(s, anoRef){
  s = String(s || '').trim();
  if (!s) return null;
  let m;
  if ((m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})$/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/))) return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2})$/))) return `20${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  if ((m = s.match(/^(\d{1,2})\/(\d{1,2})$/))) return `${anoRef}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
function detectarDelim(linha){
  const c = { '\t': (linha.match(/\t/g)||[]).length, ';': (linha.match(/;/g)||[]).length, ',': (linha.match(/,/g)||[]).length };
  return Object.entries(c).sort((a,b)=>b[1]-a[1])[0][1] > 0 ? Object.entries(c).sort((a,b)=>b[1]-a[1])[0][0] : '\t';
}
function dividirCsv(linha, delim){
  if (delim === '\t') return linha.split('\t');
  const out = []; let cur = '', aspas = false;
  for (const ch of linha){
    if (ch === '"'){ aspas = !aspas; continue; }
    if (ch === delim && !aspas){ out.push(cur); cur = ''; continue; }
    cur += ch;
  }
  out.push(cur);
  return out;
}
function palpiteMapa(header){
  const h = header.map(x => String(x).toLowerCase());
  const acha = (...termos) => h.findIndex(c => termos.some(t => c.includes(t)));
  return {
    atividade: acha('ativid', 'etapa', 'tarefa', 'task'),
    descricao: acha('descri', 'detalhe', 'o que'),
    responsavel: acha('resp'),
    inicio: acha('in\u00edc', 'inic', 'start', 'come\u00e7'),
    fim: acha('fim', 't\u00e9rm', 'term', 'end', 'entrega', 'conclus'),
  };
}

    </div>`;
  overlay.classList.add('open');
  modalEl.querySelector('#f-cancel').onclick = closeModal;

  let linhasDados = [], mapa = null, temHeader = false, header = [];
  const anoRef = (limiteProjeto() || fimProjetoAtual() || HOJE).slice(0,4);

  modalEl.querySelector('#f-massa-file').addEventListener('change', ev => {
    const f = ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => { modalEl.querySelector('#f-massa-txt').value = r.result; preVisualizar(); };
    r.readAsText(f);
  });

  function preVisualizar(){
    const bruto = modalEl.querySelector('#f-massa-txt').value.replace(/\r/g,'');
    const linhas = bruto.split('\n').map(l => l.trimEnd()).filter(l => l.trim());
    if (!linhas.length){ toast('Cole ou envie os dados primeiro'); return; }
    const delim = detectarDelim(linhas[0]);
    const grade = linhas.map(l => dividirCsv(l, delim).map(c => c.trim()));
    const primeira = grade[0].map(x => x.toLowerCase()).join(' ');
    temHeader = /ativid|descri|resp|in\u00edcio|inicio|fim|data|etapa|tarefa/.test(primeira) && !parseDataFlex(grade[0][3] || '', anoRef) && !parseDataFlex(grade[0][4] || '', anoRef);
    header = temHeader ? grade[0] : grade[0].map((_, i) => 'Coluna ' + (i+1));
    linhasDados = temHeader ? grade.slice(1) : grade;
    const palpite = temHeader ? palpiteMapa(header) : { atividade:0, descricao:1, responsavel:2, inicio:3, fim:4 };
    const nCols = Math.max(...grade.map(g => g.length));
    const campos = [['atividade','Atividade'],['descricao','Descri\u00e7\u00e3o'],['responsavel','Respons\u00e1vel'],['inicio','Data in\u00edcio'],['fim','Data fim']];
    const selects = campos.map(([k, rot]) => `
      <div><label style="display:block;font-size:.64rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;color:var(--mo-slate);margin-bottom:4px">${rot}</label>
      <select data-mapa="${k}">
        <option value="-1">\u2014 ignorar \u2014</option>
        ${Array.from({length:nCols}, (_, i) => `<option value="${i}" ${palpite[k]===i?'selected':''}>${esc(header[i] || 'Coluna '+(i+1))}</option>`).join('')}
      </select></div>`).join('');
    const prev = linhasDados.slice(0, 6).map(l => `<tr>${Array.from({length:nCols}, (_, i) => `<td>${esc(l[i]||'')}</td>`).join('')}</tr>`).join('');
    modalEl.querySelector('#f-massa-prev').innerHTML = `
      <div class="field"><label>Mapeamento das colunas (${linhasDados.length} linha(s) de dados${temHeader ? ', cabe\u00e7alho detectado' : ''})</label>
        <div class="map-grid">${selects}</div>
      </div>
      <div class="prev-scroll"><table class="prev-table">
        <tr>${Array.from({length:nCols}, (_, i) => `<th>${esc(header[i] || 'Col '+(i+1))}</th>`).join('')}</tr>${prev}
      </table></div>`;
    modalEl.querySelector('#f-massa-ok').style.display = 'inline-block';
    modalEl.querySelector('#f-massa-ok').textContent = 'Importar ' + linhasDados.length + ' atividade(s)';
  }

  modalEl.querySelector('#f-massa-ver').onclick = preVisualizar;

  modalEl.querySelector('#f-massa-ok').onclick = () => {
    mapa = {};
    modalEl.querySelectorAll('[data-mapa]').forEach(s => mapa[s.dataset.mapa] = Number(s.value));
    let ok = 0, puladas = 0;
    const pega = (l, k) => (mapa[k] >= 0 ? (l[mapa[k]] || '') : '');
    linhasDados.forEach((l, i) => {
      const ativ = pega(l, 'atividade').trim();
      const desc = pega(l, 'descricao').trim();
      let ini = parseDataFlex(pega(l, 'inicio'), anoRef);
      let fim = parseDataFlex(pega(l, 'fim'), anoRef) || ini;
      if ((!ativ && !desc) || !ini){ puladas++; return; }
      if (fim < ini) [ini, fim] = [fim, ini];
      const a = { id: 'a' + Date.now() + '_m' + i, atividade: ativ || desc.slice(0, 40), descricao: desc, responsavel: pega(l, 'responsavel').trim() || 'Molla', inicio: ini, fim: fim, status: 'nao_iniciado', dep: null, marco: false };
      a.tipo = inferirTipo(a);
      e.atividades.push(a);
      ok++;
    });
    if (!ok){ toast('Nenhuma linha v\u00e1lida \u2014 confira o mapeamento e as datas'); return; }
    registrarLog('Importou ' + ok + ' atividade(s) em massa em ' + e.aba);
    persist(); closeModal(); render();
    let msg = ok + ' atividade(s) importada(s)' + (puladas ? ' \u00b7 ' + puladas + ' linha(s) ignorada(s) (sem atividade ou data v\u00e1lida)' : '');
    const LIM = limiteProjeto();
    if (LIM){
      const nAlem = e.atividades.filter(x => x.fim > LIM).length;
      if (nAlem) msg += ' \u00b7 \u26a0 ' + nAlem + ' atividade(s) al\u00e9m do limite do projeto';
    }
    toast(msg);
  };
}

document.addEventListener('click', ev => {
  /* status: cicla em qualquer modo */
  const chip = ev.target.closest('.status-chip');
  if (chip){

    const eixo = state.eixos.find(x => x.id === chip.dataset.eixo);

      if (b && b.status !== 'concluido'){
